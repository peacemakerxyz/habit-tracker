<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>

    <form>
      <label for="addHabit"></label>
      <input type="text" for="addHabit" name="HabitName" placeholder="e.g - 'Exercise'">
      <input type="button" value="Add Habit">
    </form>

    <table>
      <thead>
        <tr>
          <th>Habit</th>
          <th>1</th>
          <th>2</th>
          <th>3</th>
          <th>4</th>
          <th>5</th>
          <th>6</th>
          <th>7</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="grid-body">
      </tbody>
    </table>


  </body>
</html>
